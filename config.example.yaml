# Copy this file to config.yaml and edit with your real values.

timezone: "Europe/Prague"

# Define the HIGH-tariff (VT) windows only — everything NOT listed here is
# treated as low tariff (NT), when the water heater should run.
#
# These are your actual confirmed D45d windows (given 2026-09-13), converted
# from your low-tariff times to their complementary high-tariff gaps:
#   weekday low tariff:  00:00-00:10;01:10-06:56;07:55-14:11;15:10-18:26;19:25-24:00
#   weekend/holiday low: 00:00-03:36;04:35-10:06;11:05-16:06;17:05-19:36;20:35-24:00
# "weekend" here also covers Czech public holidays (see holiday_country
# below) -- D45d treats holidays the same as weekends.
high_tariff_windows:
  - days: ["weekday"]
    start: "00:10"
    end: "01:10"
  - days: ["weekday"]
    start: "06:56"
    end: "07:55"
  - days: ["weekday"]
    start: "14:11"
    end: "15:10"
  - days: ["weekday"]
    start: "18:26"
    end: "19:25"
  - days: ["weekend"]
    start: "03:36"
    end: "04:35"
  - days: ["weekend"]
    start: "10:06"
    end: "11:05"
  - days: ["weekend"]
    start: "16:06"
    end: "17:05"
  - days: ["weekend"]
    start: "19:36"
    end: "20:35"

# ISO country code for public holidays, treated as "weekend" days above.
# Set to null/omit to disable holiday awareness (holidays would then use
# the weekday schedule, which is wrong for D45d).
holiday_country: "CZ"

# Where the low-tariff target temperature comes from:
#   "config" (default) -- always use target_temperature below, overriding
#     any manual change made via the app at the next tariff transition.
#   "device" -- snapshots whatever temperature was ACTUALLY RUNNING right
#     before the most recent high-tariff (off) period started, and
#     reapplies that same value on resume. A manual change you make via
#     the app WHILE it's genuinely on is respected; a change made while
#     it's off (high tariff) is deliberately ignored, since that isn't
#     "what was running". target_temperature below still acts as a
#     fallback if no snapshot exists yet (e.g. the very first run).
temperature_source: "device"

# Target temperature (Celsius). Always used when temperature_source is
# "config"; used only as a fallback when temperature_source is "device".
# The thermostat's own local ambient sensor decides when to actually
# heat, using its normal hysteresis behavior. During HIGH tariff, the
# scheduler sends a genuine power-off command instead (not just a low
# temperature) -- confirmed via direct observation to physically disable
# the output regardless of ambient temperature.
#
# Only 0.0C ("off") and values up to 39.0C have been confirmed against
# the real device so far -- TEMP_MIN_C/TEMP_MAX_C in eob_lib.py caps
# this range at 5.0-39.0C as a conservative guess. If you need a higher
# setpoint (e.g. 55C), first run:
#   python eob_client.py --test <unique_id> <mqtt_password> <target_temp>
# with a value above 39.0 -- it will refuse until you deliberately widen
# TEMP_MAX_C in eob_lib.py, so you don't accidentally send an
# unverified value to the real device.
target_temperature: 15.0

# How the scheduler talks to the thermostat.
# The BT725 is controlled via Elektrobock's cloud MQTT broker
# (mqtt.elbock.cz:8883) -- confirmed from a real traffic capture, see
# CAPTURE_GUIDE.md and eob_lib.py for details.
thermostat:
  mode: "live"               # "live" for the real device, "mock" to test
  unique_id: "XXXXXX"        # your thermostat's ID -- from the MQTT topic
                             # your app used (PTWIFI/I/<this>), or captured
                             # directly from its MQTT CONNECT packet
  mqtt_password: ""          # the MQTT password captured from your app's
                             # MQTT CONNECT packet (see CAPTURE_GUIDE.md).
                             # Keep this file out of version control.

# How often the scheduler checks the clock, in seconds.
poll_interval_seconds: 60

# Path for the scheduler's log file.
log_file: "eob_scheduler.log"

# Thermostat statistics + web dashboard (see eob_stats.py). Polls the
# device's status (measured temperature, target, relay on/off) over the
# scheduler's existing MQTT connection and serves charts at
# http://<this machine>:<port>/ . Not started with --once.
stats:
  enabled: true
  db_file: "eob_stats.db"      # SQLite history, ~1 row per poll
  poll_interval_seconds: 60
  web:
    enabled: true
    host: "0.0.0.0"            # "127.0.0.1" to keep it local-only
    port: 8080

# Where the scheduler keeps state that must survive a restart (currently the
# target temperature set from EOBApp).
state_file: "eob_state.json"

# Remote control of the low-tariff target temperature from EOBApp
# (POST/DELETE /api/target on the stats web server, so stats.web must be on).
# The token is required on top of Cloudflare Access because port 8080 is also
# reachable from your LAN. Generate one with:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
# and enter the same value as "Control token" in EOBApp's settings.
# A target set from the app is used for every low-tariff period (it wins over
# temperature_source) until reset from the app; during high tariff the heater
# stays forced off and the new target applies at the next low tariff.
control:
  enabled: false
  token: ""
  # Optional: narrow the allowed range (can't go beyond 5.0-39.0, eob_lib's
  # TEMP_MIN_C/TEMP_MAX_C).
  # min_temperature: 10.0
  # max_temperature: 25.0
